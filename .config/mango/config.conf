# More option see https://github.com/DreamMaoMao/mango/wiki/
source=./monitors.conf
source=./appearance.conf
source=./input.conf
source=./keybinds.conf

# Start these on start up
exec_once=mangobar
exec_once=steam -silent
exec_once=discord
exec_once=swaybg -i ~/Pictures/wp/wp.png -m fill
exec_once=gsr-ui

# Env
env=QT_QPA_PLATFORMTHEME,qt6ct
