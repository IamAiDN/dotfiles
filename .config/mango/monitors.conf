# Monitors
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1,rr:0
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1,rr:0

# Tag Layouts
tag_rule=id:2,monitor_name:DP-1,layout_name:scroller

# Window Rules
# -------------

# Discord (Opens on Tag 1 on HDMI-A-1)
window_rule=tags:1,monitor:HDMI-A-1,app_id:^discord$

# Godot (Send to DP-1 Tag 2, float playtest debug windows)
window_rule=tags:2,monitor:DP-1,app_id:^([Gg]odot.*|org\.godotengine\..*)$
window_rule=is_floating:1,title:.*\(DEBUG\)$

# Zed (Send to DP-1 Tag 2)
window_rule=tags:2,monitor:DP-1,app_id:^dev\.zed\.Zed$
