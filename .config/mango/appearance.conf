monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
