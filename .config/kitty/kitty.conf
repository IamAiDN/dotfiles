# Font
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Layout & Window
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no

# Cursor
cursor                  #88c0d0
cursor_text_color       #242933
cursor_shape            beam
cursor_blink_interval   0

# Selection & URLs
selection_foreground    #242933
selection_background    #88c0d0
url_color               #88c0d0
url_style               curly

# Tab Bar (if you ever use Kitty tabs)
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #242933
active_tab_background   #88c0d0
inactive_tab_foreground #d8dee9
inactive_tab_background #2e3440

# Nord Colors (matched to MangoBar & Dunst)
foreground              #e5e9f0
background              #242933
background_opacity      0.95

# Black
color0  #3b4252
color8  #4c566a

# Red
color1  #bf616a
color9  #bf616a

# Green
color2  #a3be8c
color10 #a3be8c

# Yellow
color3  #ebcb8b
color11 #ebcb8b

# Blue
color4  #81a1c1
color12 #81a1c1

# Magenta
color5  #b48ead
color13 #b48ead

# Cyan
color6  #88c0d0
color14 #8fbcbb

# White
color7  #e5e9f0
color15 #eceff4
